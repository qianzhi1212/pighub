const byId=new Map(PIGS.map(p=>[p.id,p]));
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
let toastTimer,atlasCount=4,atlasBuilt=false;
// Only open the atlas on demand, starting with the smallest existing originals.
const atlasPigs=[...PIGS].sort((a,b)=>a.bytes-b.bytes);
function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3000);}
function updateLock(){document.documentElement.classList.toggle('modal-open',$('detail-dialog').open||$('quiz-dialog').open);}
function picture(p,lazy=false){return `<div class="picture"><img ${lazy?'data-src':'src'}="${p.src}" width="${p.width}" height="${p.height}" alt="${p.title}原图" decoding="async" ${lazy?'loading="lazy"':'fetchpriority="high"'}></div>`;}
document.addEventListener('load',e=>{if(e.target.matches?.('.picture img'))e.target.parentElement.classList.add('is-loaded');},true);
document.addEventListener('error',e=>{if(e.target.matches?.('.picture img'))e.target.parentElement.classList.add('is-error');},true);
const imageObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){const img=entry.target;img.src=img.dataset.src;delete img.dataset.src;imageObserver.unobserve(img);}},{rootMargin:'0px'}):null;
function renderGallery(){
 const shown=atlasPigs.slice($('gallery').children.length,atlasCount);
 for(const p of shown){const card=document.createElement('article');card.className='card';card.dataset.pig=p.id;card.innerHTML=`<button class="card-open" type="button" data-open="${p.id}" aria-label="查看${p.type} ${p.nickname}">${picture(p,true)}<div class="card-copy"><span class="type-code">${p.type}</span><span class="card-title">${p.nickname}</span><span class="card-caption">${p.title}</span></div></button>`;$('gallery').append(card);const img=card.querySelector('img');if(imageObserver)imageObserver.observe(img);else{img.src=img.dataset.src;delete img.dataset.src;}}
 $('load-more').hidden=atlasCount>=PIGS.length;$('atlas-end').hidden=atlasCount<PIGS.length;atlasBuilt=true;
}
function setView(view){const atlas=view==='atlas';$('quiz-home').hidden=atlas;$('atlas-page').hidden=!atlas;document.querySelectorAll('.nav [data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(atlas&&!atlasBuilt)renderGallery();}
function showView(view){for(const id of ['quiz-dialog','detail-dialog'])if($(id).open)$(id).close();history.replaceState(null,'',location.pathname+location.search+(view==='atlas'?'#atlas':''));setView(view);window.scrollTo({top:0});}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
$('home-link').addEventListener('click',e=>{e.preventDefault();showView('quiz');});
$('load-more').addEventListener('click',()=>{atlasCount+=4;renderGallery();});
function openPig(id){if(!byId.has(id))return;if(location.hash===`#pig=${id}`)displayPig(id);else location.hash=`pig=${id}`;}
function displayPig(id){
 const p=byId.get(id);if(!p)return;if($('quiz-dialog').open)$('quiz-dialog').close();const buddy=buddyFor(p.type);
 $('detail-content').innerHTML=`${picture(p)}<div class="type-code">${p.type}</div><h2 id="detail-title">${p.nickname}</h2><p class="original-caption">原图「${p.title}」</p><div class="result-strengths">${p.strengths.map(s=>`<span>${s}</span>`).join('')}</div><p class="personality-summary">${p.summary}</p><p class="pig-reminder"><b>小猪的一点提醒</b>${p.watch}</p><section class="buddy-section"><h3>合拍搭子 · 趣味推荐</h3><button class="buddy-card" type="button" data-open="${buddy.id}"><span>${buddy.type} · ${buddy.nickname}</span>${icon('up-right')}</button></section><div class="detail-actions"><a class="button" href="${p.src}" download="${p.file}">保存原图</a><button class="button primary" type="button" id="detail-start">测测我是哪只猪</button></div>`;
 $('detail-start').addEventListener('click',startQuiz);if(!$('detail-dialog').open)$('detail-dialog').showModal();$('detail-dialog').scrollTop=0;updateLock();
}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open)openPig(open.dataset.open);});
async function copyShare(title,text,hash){
 if(location.protocol==='file:'){toast('请打开在线版分享测评结果');return;}const url=new URL(location.href);url.hash=hash;
 if(navigator.share){try{await navigator.share({title,text,url:url.href});return;}catch(e){if(e.name==='AbortError')return;}}
 try{await navigator.clipboard.writeText(url.href);toast('结果链接已复制，发给朋友看看吧');}catch{toast('请复制地址栏链接，分享你的测评结果');}
}
for(const dialog of [$('detail-dialog'),$('quiz-dialog')]){
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
 dialog.addEventListener('close',()=>{const params=new URLSearchParams(location.hash.slice(1));if((dialog.id==='detail-dialog'&&params.has('pig'))||(dialog.id==='quiz-dialog'&&params.has('result')))history.replaceState(null,'',location.pathname+location.search+($('atlas-page').hidden?'':'#atlas'));updateLock();});
}

const byType=new Map(PIGS.map(p=>[p.type,p]));
const CHOICE_WEIGHTS=[3,1,-1,-3];
let answers=[],questionIndex=0;
function scoreAnswers(choices){
 if(choices.length!==QUESTIONS.length||choices.some(c=>!Number.isInteger(c)||c<0||c>3))throw Error('请完成全部20题');
 const sums=[0,0,0,0];
 choices.forEach((choice,i)=>{const q=QUESTIONS[i];sums[q.axis]+=CHOICE_WEIGHTS[choice]*q.direction;});
 const scores=sums.map(sum=>Math.round((sum+15)/30*100));
 return {type:typeFromScores(scores),scores};
}
function typeFromScores(scores){return PREFERENCES.map((p,i)=>scores[i]>=50?p.left:p.right).join('');}
function buddyFor(type){return byType.get((type[0]==='E'?'I':'E')+type.slice(1));}
function startQuiz(){showView('quiz');answers=[];questionIndex=0;$('quiz-dialog').dataset.mode='questions';renderQuestion();$('quiz-dialog').showModal();$('quiz-dialog').scrollTop=0;updateLock();}
document.querySelectorAll('[data-quiz]').forEach(button=>button.addEventListener('click',startQuiz));
function renderQuestion(){
 const q=QUESTIONS[questionIndex];
 $('quiz-content').innerHTML=`<div class="eyebrow"><span class="dot"></span>PIG PERSONALITY TEST</div><h2 id="quiz-title">猪猪性格测评</h2><p class="quiz-intro">选更自然的反应就好，每一种偏好都有它的可爱。</p><div class="quiz-progress-label"><span>20 道生活情境 · 约 3 分钟</span><span>${String(questionIndex+1).padStart(2,'0')} / ${QUESTIONS.length}</span></div><div class="progress-track"><span style="width:${questionIndex/QUESTIONS.length*100}%"></span></div><h3 class="quiz-question" id="current-question" tabindex="-1">${q.text}</h3><div class="quiz-options" role="group" aria-labelledby="current-question">${q.options.map((text,i)=>`<button class="quiz-option" type="button" data-answer="${i}" aria-pressed="${answers[questionIndex]===i}"><span>${'ABCD'[i]}</span>${text}</button>`).join('')}</div><div class="quiz-controls"><button class="button secondary" id="quiz-back" type="button" ${questionIndex===0?'disabled':''}>上一题</button><button class="button primary" id="quiz-next" type="button" ${answers[questionIndex]===undefined?'disabled':''}>${questionIndex===QUESTIONS.length-1?'看看我的猪猪类型':'下一题'}${icon('arrow')}</button></div><p class="quiz-disclaimer">参考 MBTI 四组偏好编写的原创趣味题，非官方测评。</p>`;
 $('quiz-content').querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>{answers[questionIndex]=Number(button.dataset.answer);$('quiz-content').querySelectorAll('[data-answer]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.answer)===answers[questionIndex]));$('quiz-next').disabled=false;}));
 $('quiz-back').addEventListener('click',()=>{questionIndex--;renderQuestion();$('current-question').focus();});
 $('quiz-next').addEventListener('click',()=>{if(answers[questionIndex]===undefined)return;if(questionIndex<QUESTIONS.length-1){questionIndex++;renderQuestion();$('current-question').focus();}else{const result=scoreAnswers(answers);location.hash=`result=${result.type}&v=${result.scores.join(',')}`;}});
}
function displayResult(type,scores){
 const p=byType.get(type);if(!p)return;const buddy=buddyFor(type);
 if($('detail-dialog').open)$('detail-dialog').close();$('quiz-dialog').dataset.mode='result';
 const near=PREFERENCES.filter((pref,i)=>Math.abs(scores[i]-50)<15).map(pref=>pref.pair);
 const explanation=PREFERENCES.map((pref,i)=>`<p><b>${type[i]} · ${scores[i]>=50?pref.leftName:pref.rightName}</b>${scores[i]>=50?pref.leftText:pref.rightText}</p>`).join('');
 const buddyReason=type[0]==='I'?'你慢慢想清楚，搭子帮你打开话题。':'你先打开话题，搭子帮你留出沉淀的空间。';
 $('quiz-content').innerHTML=`<div class="result-top"><div class="eyebrow">YOUR LITTLE PIG</div>${picture(p)}<div class="type-code">${type}</div><h2 id="quiz-title" tabindex="-1">${p.nickname}</h2><p class="original-caption">最适配你的原图「${p.title}」</p><div class="result-strengths">${p.strengths.map(s=>`<span>${s}</span>`).join('')}</div></div><p class="personality-summary">${p.summary}</p><section class="buddy-section"><h3>最合拍的猪猪搭子 · 趣味推荐</h3><button class="buddy-card" type="button" data-open="${buddy.id}" aria-label="查看搭子：${buddy.nickname}"><span>${buddy.type} · ${buddy.nickname}</span>${icon('up-right')}</button><p>${buddyReason}理解方式和生活节奏相近，社交方式互补。</p></section><details class="analysis"><summary>看看我的四组偏好与性格分析</summary><div class="preference-meters">${PREFERENCES.map((pref,i)=>`<div><div class="preference-ends"><span>${pref.left} ${pref.leftName} ${scores[i]}%</span><span>${pref.right} ${pref.rightName} ${100-scores[i]}%</span></div><div class="result-meter-track" role="meter" aria-label="${pref.pair}：${pref.left}侧偏向" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${scores[i]}"><span style="width:${scores[i]}%"></span></div></div>`).join('')}</div><p class="section-note">展示本次回答的偏向，不代表能力高低或准确率。</p>${near.length?`<p class="near-note">${near.join('、')} 两侧比较接近，换个情境也可能展现另一面。</p>`:''}<div class="analysis-grid">${explanation}</div><p class="pig-reminder"><b>给小猪的一点提醒</b>${p.watch}</p></details><div class="result-actions"><button class="button primary" type="button" id="share-result">分享我的小猪</button><button class="button" type="button" id="restart-quiz">重新测一次</button></div><button class="text-button result-atlas" type="button" id="result-atlas">认识其他小猪 ↗</button><p class="quiz-disclaimer">原创趣味测评，非官方 MBTI。搭子为本站趣味设定。</p>`;
 $('share-result').addEventListener('click',()=>copyShare(`我的猪猪性格：${type} ${p.nickname}`,`我的合拍搭子是「${buddy.nickname}」。你是哪只猪？`,`result=${type}&v=${scores.join(',')}`));
 $('restart-quiz').addEventListener('click',startQuiz);$('result-atlas').addEventListener('click',()=>showView('atlas'));
 if(!$('quiz-dialog').open)$('quiz-dialog').showModal();$('quiz-dialog').scrollTop=0;$('quiz-title').focus({preventScroll:true});updateLock();
}
function syncRoute(){
 const params=new URLSearchParams(location.hash.slice(1));
 if(byId.has(params.get('pig')))displayPig(params.get('pig'));
 else if(byType.has(params.get('result'))){const raw=params.get('v')||'';const scores=raw.split(',').map(Number);if(raw&&scores.length===4&&scores.every(n=>Number.isInteger(n)&&n>=0&&n<=100)&&typeFromScores(scores)===params.get('result'))displayResult(params.get('result'),scores);}
 else{setView(location.hash==='#atlas'?'atlas':'quiz');if($('detail-dialog').open)$('detail-dialog').close();if($('quiz-dialog').open&&$('quiz-dialog').dataset.mode==='result')$('quiz-dialog').close();}
}
window.addEventListener('hashchange',syncRoute);

setView(location.hash==='#atlas'?'atlas':'quiz');syncRoute();
</script></body></html>
